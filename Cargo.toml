[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/ffi",
    "crates/cli",
    "crates/desktop",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

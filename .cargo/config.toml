# Android NDK cross-build (desktop only — do NOT set a linker here or Termux
# host builds break, since Termux itself is aarch64-linux-android).
# On a desktop with the NDK, run e.g.:
#   ANDROID_NDK_HOME=~/Android/Sdk/ndk/26.1.10909125 \
#     cargo build -p valenced-ffi --release --target aarch64-linux-android
# with the NDK's clang wrapper on PATH.
#
# iOS: cargo build -p valenced-ffi --release --target aarch64-apple-ios

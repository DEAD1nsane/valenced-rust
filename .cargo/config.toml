# Android NDK linker (set ANDROID_NDK_HOME to your NDK, e.g. ~/Android/Sdk/ndk/26.1.10909125)
# Then: cargo build -p valenced-ffi --release --target aarch64-linux-android
# The default Termux host target is unaffected — this only applies when building for Android.
[target.aarch64-linux-android]
linker = "aarch64-linux-android34-clang"

# iOS: no linker override needed; use
#   cargo build -p valenced-ffi --release --target aarch64-apple-ios

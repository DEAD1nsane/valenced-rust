name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, targets: aarch64-linux-android }
      - run: cargo test --workspace
      - run: cargo test -p valenced-runtime --features js-compat
      - run: cargo test -p valenced-runtime --features wasm
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo check -p valenced-ffi --target aarch64-linux-android
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - run: cargo check -p valenced-ffi --target aarch64-apple-ios

name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux GPUI deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config g++ libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-shm0-dev libxcb-util0-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libvulkan-dev libfontconfig-dev libfreetype-dev libasound2-dev libdbus-1-dev clang
      - run: cargo build --locked --release -p valenced-cli -p valenced-desktop --target ${{ matrix.target }} --features valenced-desktop/gpui
      - name: Stage uniquely-named assets
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          for bin in valenced valenced-desktop; do
            src="target/${{ matrix.target }}/release/${bin}${ext}"
            cp "$src" "dist/${bin}-${{ matrix.target }}${ext}"
          done
          cd dist && sha256sum valenced-* valenced-desktop-* > sha256sums-${{ matrix.target }}.txt || shasum -a 256 valenced-* valenced-desktop-* > sha256sums-${{ matrix.target }}.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttldr/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Build libvalenced_ffi.so (arm64-v8a)
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: cargo build --locked --release -p valenced-ffi --target aarch64-linux-android
      - name: Stage asset + sha256
        run: |
          cp target/aarch64-linux-android/release/libvalenced_ffi.so libvalenced_ffi-aarch64-linux-android.so
          sha256sum libvalenced_ffi-aarch64-linux-android.so > sha256sums-aarch64-linux-android.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            libvalenced_ffi-aarch64-linux-android.so
            sha256sums-aarch64-linux-android.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
